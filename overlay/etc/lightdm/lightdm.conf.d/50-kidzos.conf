[Seat:*]
# The autologin target is a dedicated local account named "guest", not LightDM's temporary guest session.
autologin-user=guest
autologin-user-timeout=0
user-session=openbox
greeter-hide-users=true
# This disables LightDM's ephemeral guest-session feature, not the dedicated local guest account.
allow-guest=false
greeter-show-manual-login=false
